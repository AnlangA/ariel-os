version: 0.4.1
targets:
  art-pi2:
    chip: stm32h7r7l8
    ariel:
      swi: WWDG
      global_env:
        # Both channels off before application startup: red low, blue high.
        CONFIG_GPIO_OUTPUTS: PO1:low,PO5:high
    leds:
      - pin: PO1
        aliases:
          - LED1
        color: red
        active: high
      - pin: PO5
        aliases:
          - LED2
        color: blue
        active: low
    buttons:
      - pin: PC13
        active: low
