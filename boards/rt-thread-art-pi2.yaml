version: 0.4.1
targets:
  rt-thread-art-pi2:
    chip: stm32h7r7l8
    ariel:
      swi: WWDG
    leds:
      - pin: PO1
        aliases:
          - LED1
        color: red
        active: high
      - pin: PO5
        aliases:
          - LED2
        color: blue
        active: low
    buttons:
      - pin: PC13
        active: low
